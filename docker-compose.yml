      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/dashboard-service
    environment:
      PORT: 3012
      MONGO_URI: mongodb://mongo:27017/labflow_dashboard
    ports:
      - "3012:3012"
    depends_on:
      mongo:
        condition: service_started
volumes:
  mongo-data:

